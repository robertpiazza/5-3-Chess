<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5³ Chess — Raumschach</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ── HUD ─────────────────────────────────────────────────────────────── -->
  <div id="hud">
    <div id="title">5³ Chess</div>
    <div id="turn-display">White's Turn</div>
    <div id="player-color-indicator" class="hidden"></div>
    <div id="status-display"></div>
    <button id="new-game-btn" disabled>New Game</button>
    <button id="view-toggle-btn" disabled>Cube View</button>
    <div id="legend">
      <div class="legend-title">Pieces</div>
      <div class="legend-item"><span class="dot rook"></span> Rook</div>
      <div class="legend-item"><span class="dot bishop"></span> Bishop</div>
      <div class="legend-item"><span class="dot knight"></span> Knight</div>
      <div class="legend-item"><span class="dot queen"></span> Queen</div>
      <div class="legend-item"><span class="dot king"></span> King</div>
      <div class="legend-item"><span class="dot unicorn"></span> Unicorn</div>
      <div class="legend-item"><span class="dot pawn"></span> Pawn</div>
    </div>
    <div id="controls-hint">
      Drag to orbit &nbsp;|&nbsp; Scroll to zoom
    </div>
  </div>

  <!-- ── Lobby overlay ────────────────────────────────────────────────────── -->
  <div id="lobby-overlay">
    <div id="lobby-box">

      <!-- Panel 1: mode selection -->
      <div id="lobby-mode">
        <div class="lobby-title">5³ Chess</div>
        <div class="lobby-subtitle">Raumschach — 5×5×5</div>
        <button id="btn-create" disabled>Create Game</button>
        <button id="btn-join-panel" disabled>Join Game</button>
        <button id="btn-local" disabled>Local Play</button>
        <div id="lobby-loading">Loading models…</div>
      </div>

      <!-- Panel 2: host waiting for opponent -->
      <div id="lobby-host" class="hidden">
        <div class="lobby-title">Waiting for opponent</div>
        <div class="lobby-label">Share this code:</div>
        <div id="room-code-display">——————</div>
        <button id="btn-copy-code">Copy Code</button>
        <button class="btn-back" id="btn-back-host">← Cancel</button>
      </div>

      <!-- Panel 3: guest entering a room code -->
      <div id="lobby-join" class="hidden">
        <div class="lobby-title">Join a Game</div>
        <div class="lobby-label">Enter room code:</div>
        <input id="room-code-input" type="text" maxlength="6"
               placeholder="XXXXXX" autocomplete="off" spellcheck="false" />
        <button id="btn-join">Join</button>
        <div id="join-error" class="hidden">Room not found — check the code.</div>
        <button class="btn-back" id="btn-back-join">← Back</button>
      </div>

    </div>
  </div>

  <!-- ── Game-over overlay ─────────────────────────────────────────────────── -->
  <div id="game-over-overlay" class="hidden">
    <div id="game-over-box">
      <div id="game-over-title">Game Over</div>
      <div id="game-over-result"></div>
      <button id="play-again-btn">Play Again</button>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three":              "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/":      "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
      "firebase-app":       "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase-database":  "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
